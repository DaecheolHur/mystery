<head>
<meta charset="UTF-8">

<meta name="description" content="시작할 때마다 다른 사건이 나오는 텍스트 추리 게임.">
<title>야간 기록 - 텍스트 추리</title>
<style>
:root{--bg:#14110e;--panel:#221c17;--ink:#f4ead8;--muted:#c8b79a;--line:#3b3128;--accent:#e0a15a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#2a211a,var(--bg) 55%);color:var(--ink);font-family:"Georgia","Noto Serif KR",serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 48px}
header{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}
h1{margin:0;font-size:34px;font-weight:700}header p{margin:4px 0 0;color:var(--muted)}
button{font:inherit}
.restart{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 12px;cursor:pointer}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px}
.story,.clues{background:rgba(34,28,23,.92);border:1px solid var(--line);border-radius:18px}
.story{padding:26px}
#scene{font-size:18px;line-height:1.85;white-space:pre-wrap}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.choices button{text-align:left;background:#31281f;color:var(--ink);border:1px solid #4a3d31;border-radius:12px;padding:12px 14px;cursor:pointer}
.choices button:hover{border-color:var(--accent)}
.clues{padding:18px}
.clues h2{margin:0 0 12px;font-size:16px}
.clues li{margin:8px 0;color:var(--muted);line-height:1.5}
.empty{color:var(--muted)}
@media(max-width:760px){.layout{grid-template-columns:1fr}h1{font-size:28px}}
</style>
</head>

<div>

</header>
<div class="layout">

<div id="choices" class="choices"></div>

</div>

 ],
 people:[
  {id:"resident",name:"라현",need:"phone",wrong:"라현의 인터폰은 집 안에서 응답한 기록이다.\n옥상 문과는 층이 다르다."},
  {id:"courier",name:"고다인",need:"camera",wrong:"고다인의 배송 사진은 현관 앞에서 끝난다.\n옥상으로 올라간 엘리베이터 기록은 없다."},
  {id:"keeper",name:"피수영",need:"ring",guess:"벌어진 고리만으로는 열쇠를 누가 뺐는지 단정하기 어렵다.\n피수영은 아침 점검 자국이라 말한다.",truth:"고리는 오늘 오후에 벌어졌고, 겹쳐 쓴 서명은 그 시간을 덮으려는 것이다.\n옥상 열쇠는 관리인 외에는 장부에서 빠지지 않는다.\n\n창고 상자 안에서 열쇠가 나온다. 접수하지 않은 분실물 목록을 가리려는 자리였다."}
 ]
},
{
 title:"잠기지 않은 서랍",
 tagline:"서명 직전의 계약서만 서랍에서 빠졌다.",
 intro:"디자인 스튜디오의 서랍이 열려 있고, 방금 인쇄한 계약서만 없다.\n대표 구도원, 디자이너 메아리, 손님 차린이 사무실에 남아 있다.\n프린터는 아직 따뜻하다.",
 hall:"회의실 유리 너머로 빈 서랍이 보인다.\n더 찾거나 지금 지목할 수 있다.",
 required:["memo","printer","lobby"],
 culprit:"boss",
 clues:{
  memo:"계약서 자리에 구도원의 수정 메모만 남아 있다.",

  clause:"메모에는 위약 조항을 빼자는 문장이 적혀 있다."
 },
 places:[
  {label:"열린 서랍을 살핀다",text:"계약서가 있던 칸에는 구도원의 메모만 남아 있다.\n문장은 짧다. 위약 조항을 빼자는 내용이다.",set:["memo","clause"],talk:"구도원에게 묻는다",talkText:"구도원이 메모를 접으려다 멈춘다.\n\n“초안을 다듬자고 적어 둔 겁니다. 원본은 손님이 가져갔을 수 있어요.”"},
  {label:"프린터 기록을 본다",text:"이 층 프린터는 한 시간째 조용하다.\n메아리의 사원 카드는 같은 시각 3층 출력실에 찍혀 있다.",set:["printer"],talk:"메아리에게 묻는다",talkText:"메아리가 사원 카드 기록을 보여 준다.\n\n“시안을 뽑으러 3층에 있었어요. 서랍 비밀번호는 모릅니다.”"},

 ],
 people:[
  {id:"designer",name:"메아리",need:"printer",wrong:"메아리의 카드는 3층 출력실에 머물러 있다.\n서랍이 있는 회의실과는 층이 다르다."},
  {id:"guest",name:"차린",need:"lobby",wrong:"차린의 대기 번호는 로비에서 호출되지 않았다.\n그는 계약서가 있는 방까지 들어오지 못했다."},
  {id:"boss",name:"구도원",need:"memo",guess:"메모만으로는 원본을 누가 뺐는지 알 수 없다.\n구도원은 초안을 고치자고 적은 것이라 말한다.",truth:"메모의 위약 조항은 그가 빼려던 문장이다.\n서랍 비밀번호를 아는 사람은 대표뿐이다.\n\n그의 코트 안주머니에서 접힌 계약서가 나온다. 서명은 아직 비어 있다."}
 ]

];

let current=null;
const state={flags:new Set(),scene:"start"};
const sceneEl=document.getElementById("scene");
const choiceEl=document.getElementById("choices");
const clueEl=document.getElementById("clueList");

function pickCase(){
 const last=sessionStorage.getItem("mystery-last");
 const pool=cases.filter(item=>item.title!==last);
 const raw=new URLSearchParams(location.search).get("case");
 const requested=raw===null?NaN:Number(raw);
 const chosen=Number.isInteger(requested)&&cases[requested]?cases[requested]:pool[Math.floor(Math.random()*pool.length)];
 sessionStorage.setItem("mystery-last",chosen.title);
 return chosen;
}
function renderClues(){
 const found=[...state.flags].filter(flag=>current.clues[flag]);
 clueEl.replaceChildren();
 if(!found.length){
  const item=document.createElement("li");
  item.className="empty";
  item.textContent="아직 찾은 단서가 없습니다.";
  clueEl.appendChild(item);
  return;
 }
 found.forEach(flag=>{
  const item=document.createElement("li");
  item.textContent=current.clues[flag];
  clueEl.appendChild(item);
 });
}
function sceneText(){
 if(state.scene==="start") return current.intro;
 if(state.scene==="hall") return current.hall;
 if(state.scene==="accuse") return "이름을 적기 전에, 가지고 있는 단서를 헤아려 본다.";
 const place=current.places.find(item=>item.label===state.scene);
 if(place) return place.text;
 const person=current.people.find(item=>item.id===state.scene);
 if(person) return state.endingText;
 const talk=current.places.find(item=>item.talk===state.scene);
 return talk?talk.talkText:"";
}
function objectParticle(name){
 const code=name.charCodeAt(name.length-1);
 if(code<0xac00||code>0xd7a3) return "을";
 return (code-0xac00)%28===0?"를":"을";
}
function choices(){
 if(current.people.some(person=>person.id===state.scene)) return [["다른 사건 시작","__restart"]];
 if(state.scene==="start"||state.scene==="hall"){
  const items=current.places.map(place=>[place.label,place.label]);
  if(state.scene==="hall") items.push(["범인을 지목한다","accuse"]);
  return items;
 }
 if(current.places.some(place=>place.label===state.scene)){
  const place=current.places.find(item=>item.label===state.scene);
  return [[place.talk,place.talk],["중앙으로 돌아간다","hall"]];
 }
 if(state.scene==="accuse"){
  const suspects=current.people.filter(person=>state.flags.has(person.need));
  if(!suspects.length) return [["단서가 더 필요하다","hall"]];
  return suspects.map(person=>[`${person.name}${objectParticle(person.name)} 지목한다`,person.id]);
 }
 return [["다른 곳을 살핀다","hall"]];
}
function render(){
 sceneEl.textContent=sceneText();
 choiceEl.replaceChildren();
 choices().forEach(choice=>{
  const button=document.createElement("button");
  button.type="button";
  button.textContent=choice[0];
  button.addEventListener("click",()=>choose(choice[1]));
  choiceEl.appendChild(button);
 });
 renderClues();
}
function choose(next){
 if(next==="__restart"){startGame();return}
 const place=current.places.find(item=>item.label===next);
 if(place) (place.set||[]).forEach(flag=>state.flags.add(flag));
 const person=current.people.find(item=>item.id===next);
 if(person){
  const proven=current.required.every(flag=>state.flags.has(flag));
  state.endingText=person.id===current.culprit?(proven?person.truth:person.guess):person.wrong;
 }
 state.scene=next;
 render();
}
function startGame(){
 current=pickCase();
 document.getElementById("title").textContent=current.title;
 document.getElementById("tagline").textContent=current.tagline;
 document.title=current.title+" - 텍스트 추리";
 state.flags.clear();
 state.scene="start";
 state.endingText="";
 render();
}
document.querySelector(".restart").addEventListener("click",startGame);
startGame();
</script>
